services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"   # REST-API + Web-UI unter http://<server>:6333/dashboard
    volumes:
      - qdrant_data:/qdrant/storage

  dashboard:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - qdrant

volumes:
  qdrant_data:
